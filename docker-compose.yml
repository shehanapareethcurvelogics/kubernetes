# Docker Compose allows you to run multiple containers together
# In this case, we'll run Django app + PostgreSQL database + React frontend

services:
  # Service 1: PostgreSQL Database
  # Django needs a database to store user data, posts, etc.
  db:
    image: postgres:15-alpine
    # image: tells Docker which pre-built image to use
    # postgres:15-alpine is a lightweight PostgreSQL database
    
    environment:
      # Environment variables for database configuration
      POSTGRES_DB: django_auth_db      # Database name
      POSTGRES_USER: django_user        # Database username
      POSTGRES_PASSWORD: django_pass    # Database password
    volumes:
      # Persist database data even if container stops
      # postgres_data is a named volume that stores database files
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose database port 5433 to host machine (5432 is already in use)
      # Format: "host_port:container_port"
      # Changed to 5433 externally, but container still uses 5432 internally
      - "5433:5432"

  # Service 2: Django Backend Application
  backend:
    build: ./backend
    # build: ./backend means "build using Dockerfile in backend directory"
    
    command: python manage.py runserver 0.0.0.0:8000
    # Override the CMD from Dockerfile
    
    volumes:
      # Mount backend directory to /app in container
      # This allows code changes to reflect immediately (hot reload)
      - ./backend:/app
    ports:
      # Expose Django server on port 8000
      - "8000:8000"
    depends_on:
      # Wait for database to be ready before starting Django
      - db
    environment:
      # Environment variables for Django
      - DEBUG=1
      - DATABASE_URL=postgresql://django_user:django_pass@db:5432/django_auth_db
      # DATABASE_URL format: postgresql://user:password@host:port/database
      # 'db' is the service name, Docker Compose creates a network between services

  # Service 3: React Frontend Application
  frontend:
    build: ./frontend
    # build: ./frontend means "build using Dockerfile in frontend directory"
    
    ports:
      # Expose frontend on port 3000 (nginx serves the built React app)
      - "3000:80"
    depends_on:
      # Wait for backend to be ready before starting frontend
      - backend
    # No volumes needed for production build
    # Frontend is built into the image

volumes:
  # Define named volume for database persistence
  postgres_data:

