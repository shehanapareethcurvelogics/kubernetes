apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: django-auth-app
  labels:
    app: frontend
spec:
  type: NodePort  # Expose externally
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080  # External port (30000-32767 range)
    protocol: TCP
  selector:
    app: frontend

